name: Deploy office-assistant to Fly.io

# Manual until the Fly app, Postgres, and secrets exist (see office-assistant/README.md).
# Once they do, add a push trigger for main with paths: office-assistant/**.
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: office-assistant-deploy
    defaults:
      run:
        working-directory: office-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
