app = "hibid-sniper"
primary_region = "iad"

[build]

[env]
  PORT = "8080"

# This has to run continuously to catch auction closes, not just respond
# to HTTP traffic — never let Fly suspend the machine for being idle.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
