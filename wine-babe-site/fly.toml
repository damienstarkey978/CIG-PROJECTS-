# Same Fly.io org as The Ritzy Heirloom (org slug personal).
# Live Ritzy app: ritzyheirloom on Fly, serving ritzyheirloom.com.
app = "wine-babe"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
